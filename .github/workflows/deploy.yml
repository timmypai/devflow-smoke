name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, devflow, oracle]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: deploy, host smoke and provenance
        run: .devflow/deploy.sh
