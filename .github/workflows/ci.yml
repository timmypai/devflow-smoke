name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: exact-head rules, lessons and negative probes
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          GITHUB_SHA="$SOURCE_SHA" .devflow/prepare-evidence.sh
          bash .devflow/check.sh
          GITHUB_SHA="$SOURCE_SHA" python3 .devflow/contract-evidence.py
          GITHUB_SHA="$SOURCE_SHA" python3 .devflow/lesson-gate-evidence.py
      - name: P2 PR lesson gate
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .devflow/check.py --pr "$PR_BASE_SHA"
      - name: retain real query regression base/head proof (AC-3)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: GITHUB_SHA="$SOURCE_SHA" python3 .devflow/query-gate-evidence.py "$PR_BASE_SHA"
      - name: retain NO-PROOF-AC-3 isolated 404 assertion base/head proof
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: GITHUB_SHA="$SOURCE_SHA" python3 .devflow/no-proof-evidence.py "$PR_BASE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devflow-contract-pr-${{ env.SOURCE_SHA }}
          path: .devflow/evidence/
          if-no-files-found: error
          retention-days: 14

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: stdlib unittest (exact head)
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          .devflow/test.sh
      - name: docker build, run, host smoke and revision
        run: GITHUB_SHA="$SOURCE_SHA" .devflow/container-smoke.sh
      - name: validate deployment compose contract
        run: |
          set -a
          . .devflow/config.env
          set +a
          touch deploy/.env
          GITHUB_SHA="$SOURCE_SHA" DEVFLOW_IMAGE="devflow/${DEVFLOW_APP}:${SOURCE_SHA:0:12}" \
            docker compose -f deploy/compose.yml config --quiet
          GITHUB_SHA="$SOURCE_SHA" DEVFLOW_IMAGE="devflow/${DEVFLOW_APP}:${SOURCE_SHA:0:12}" \
            DEVFLOW_REVISION=stale-runner-value docker compose -f deploy/compose.yml config --format json | \
            python3 -c 'import json, os, sys; app = json.load(sys.stdin)["services"]["app"]; assert app["environment"]["DEVFLOW_REVISION"] == os.environ["SOURCE_SHA"]; assert app["build"]["args"]["VCS_REF"] == os.environ["SOURCE_SHA"]'

  verify:
    strategy:
      fail-fast: false
      # Manual dispatch of the trusted branch also exercises Oracle ARM64,
      # without touching production, :live, or its fixed port/project.
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"label":"x64","runner":["ubuntu-latest"]},{"label":"arm64","runner":["ubuntu-24.04-arm"]},{"label":"oracle","runner":["self-hosted","Linux","ARM64","devflow","oracle"]}]' || '[{"label":"x64","runner":["ubuntu-latest"]},{"label":"arm64","runner":["ubuntu-24.04-arm"]}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: matrix.label != 'oracle'
        with:
          python-version: '3.14'
      - name: isolate evidence
        run: GITHUB_SHA="$SOURCE_SHA" .devflow/prepare-evidence.sh
      - name: ephemeral compose service
        run: GITHUB_SHA="$SOURCE_SHA" .devflow/up.sh
      - name: real Docker synthetic failure and redaction probe
        if: matrix.label != 'oracle'
        run: GITHUB_SHA="$SOURCE_SHA" python3 .devflow/probe-diagnostics.py
      - name: HTTP and real browser journeys
        run: GITHUB_SHA="$SOURCE_SHA" .devflow/verify.sh
      - name: diagnostics (actual temporary project, before cleanup)
        if: always() && env.DEVFLOW_VERIFY_PROJECT != ''
        run: GITHUB_SHA="$SOURCE_SHA" bash .devflow/capture.sh "$DEVFLOW_VERIFY_PROJECT" ci
      - name: cleanup ephemeral project
        if: always() && env.DEVFLOW_VERIFY_PROJECT != ''
        run: GITHUB_SHA="$SOURCE_SHA" bash .devflow/cleanup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devflow-evidence-pr-${{ env.SOURCE_SHA }}-${{ matrix.label }}
          path: .devflow/evidence/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devflow-diagnostics-pr-${{ env.SOURCE_SHA }}-${{ matrix.label }}
          path: .devflow/diagnostics/
          if-no-files-found: warn
          retention-days: 7

  # Exact success only: skipped/cancelled/unknown are not a pass.
  devflow-ci:
    if: always()
    needs: [check, test, verify]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$CHECK_RESULT" = success && test "$TEST_RESULT" = success && test "$VERIFY_RESULT" = success
